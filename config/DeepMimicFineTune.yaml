behaviors:
  DMWalker:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096        # Imitation: 256
      buffer_size: 65536       # 131072      # Imitation: 4096
      learning_rate: 0.000025 # Imitation: 0.00005   Default: 0.0003
      beta: 0.0025            # Default: 0.005   
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3            # Default 3
      learning_rate_schedule: constant  # Imitation: constant
      beta_schedule: constant           # Imitation: constant
      epsilon_schedule: constant        # Imitation: constant
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99          # Imitation:  0.95 Default: 0.995
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 60000000
    time_horizon: 128         # Imitation: 32 Default: 64 Heading: 128
    summary_freq: 50000
