behaviors:
  DMWalker:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024        # Imitation: 256
      buffer_size: 32768      # Imitation: 4096
      learning_rate: 0.00005 # Imitation: 0.00005   Default: 0.0003
      beta: 0.005            # Default: 0.005   
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99          # Imitation: 4096 Default: 0.995
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 20000000
    time_horizon: 64         # Imitation: 32
    summary_freq: 50000
