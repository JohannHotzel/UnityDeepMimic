behaviors:
  DMWalker:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096        # Imitation: 256
      buffer_size: 131072      # Imitation: 4096
      learning_rate: 0.00005 # Imitation: 0.00005   Default: 0.0003
      beta: 0.005            # Default: 0.005   
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant  # Imitation: constant
      beta_schedule: constant           # Imitation: constant
      epsilon_schedule: constant        # Imitation: constant
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995          # Imitation:  0.95 Default: 0.995
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 40000000
    time_horizon: 128         # Imitation: 32
    summary_freq: 50000
